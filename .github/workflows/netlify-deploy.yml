name: Netlify Deploy

# Builds the app here and pushes the already-built dist/ to Netlify via the API, so the deploy
# itself never counts against Netlify's own build-minutes quota - only Netlify's native
# git-triggered builds do. Netlify's "Stop builds" / disconnected-CD setting can stay on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: netlify-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci
      # Cloud sync only offers a provider whose client id is baked in at build time, so these
      # must be set here - Netlify's own dashboard env vars don't apply to an Actions build.
      # Accepted as either a repo variable or a repo secret.
      - run: npm run build
        env:
          VITE_DROPBOX_CLIENT_ID: ${{ vars.VITE_DROPBOX_CLIENT_ID || secrets.VITE_DROPBOX_CLIENT_ID }}
          VITE_MICROSOFT_CLIENT_ID: ${{ vars.VITE_MICROSOFT_CLIENT_ID || secrets.VITE_MICROSOFT_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./dist"
          production-branch: main
          # Gives PR previews a predictable "pr<number>--brew-me-app.netlify.app" URL instead of
          # Netlify's default random-build-id alias. Left unset on a `main` push (production
          # deploy), since `github.event.number` only exists on `pull_request` events.
          alias: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
