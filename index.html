<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8b5000" />
    <meta
      name="description"
      content="Dial in the perfect water:coffee ratio, save your favorite brews, run a pour-over timer, and share any ratio with a friend."
    />
    <title>BrewMe — Coffee Ratio Calculator & Brew Guide</title>

    <!--
			Open Graph / Twitter Card - the defaults every crawler sees. For
			`/share?...` links, netlify/edge-functions/share-meta.ts rewrites
			og:title, og:description, og:url and <title> (via a plain string
			replace, so the attribute order/quoting here has to stay exactly as
			written) to describe that specific brew instead of the app as a
			whole. og:image is intentionally left pointing at the same generic
			banner for every page, shared and not - there's no per-brew image.
			public/og-image.png is a static 1200x630 render (the recommended
			1.91:1 OG ratio) of the app icon centered on the app's background
			color, generated the same way as the iOS splash screens below -
			icon-512x512.png alone is square and gets flagged by preview
			validators for the wrong aspect ratio.
		-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrewMe" />
    <meta property="og:title" content="BrewMe — Coffee Ratio Calculator & Brew Guide" />
    <meta
      property="og:description"
      content="Dial in the perfect water:coffee ratio, save your favorite brews, run a pour-over timer, and share any ratio with a friend."
    />
    <meta property="og:image" content="https://brewme.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://brewme.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrewMe — Coffee Ratio Calculator & Brew Guide" />
    <meta
      name="twitter:description"
      content="Dial in the perfect water:coffee ratio, save your favorite brews, run a pour-over timer, and share any ratio with a friend."
    />
    <meta name="twitter:image" content="https://brewme.app/og-image.png" />

    <!-- Favicon + home screen / install icons (from /public/icon(s)) -->
    <link rel="icon" type="image/png" href="/icon/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- iOS home-screen app behavior: full screen, no Safari chrome, themed status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrewMe" />

    <!--
			iOS has no manifest-driven splash screen (unlike Android/Chrome), so
			it's approximated here with `apple-touch-startup-image` for a handful
			of common device sizes - a full-bleed rendering of the app icon,
			centered on the page background color, shown while the app boots.
		-->
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
			Google Fonts is loaded async (preload + swap the media type on load) so
			it doesn't sit in the render-blocking critical path - `display=swap` in
			the URL means text still renders immediately in the fallback font stack
			and swaps to Roboto/Material Symbols once the stylesheet arrives,
			instead of the page waiting on a 3rd-party round trip before painting
			anything. The <noscript> fallback covers the (rare) no-JS case, where
			the `onload` swap trick can't run.
		-->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      />
    </noscript>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="./src/app-shell.ts"></script>
  </head>
  <body>
    <app-shell></app-shell>
  </body>
</html>
