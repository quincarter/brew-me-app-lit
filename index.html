<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="%BASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8b5000" />
    <title>BrewMe</title>

    <!-- Favicon + home screen / install icons (from /public/icon(s)) -->
    <link rel="icon" type="image/png" href="/icon/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- iOS home-screen app behavior: full screen, no Safari chrome, themed status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BrewMe" />
    <!--
			iOS has no manifest-driven splash screen (unlike Android/Chrome), so
			it's approximated here with `apple-touch-startup-image` for a handful
			of common device sizes - a full-bleed rendering of the app icon,
			centered on the page background color, shown while the app boots.
		-->
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <script src="/detect-color-scheme.js"></script>
    <link rel="stylesheet" href="./src/index.css" />
    <script type="module" src="./src/app-shell.ts"></script>
  </head>
  <body>
    <app-shell></app-shell>
  </body>
</html>
